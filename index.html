<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Sign Up</title>
</head>
<body>
    <div class="mainSignUpBlock">
        <!-- Graphic block 1/3 of width -->
        <div class="imageArea">
            <div id="emptySpace1"></div>
            <div id="logo-area" class="black-transparent">
                <img src="./images/odin-lined.png">
                <div class="center">
                    <p id="odin-text">ODIN</p>
                </div>
            </div>
            <div id="imageCredit">
                <p>Photo by <a href="https://unsplash.com/de/@haliewestphoto" class="credit-link">Halie West</a> on <a href="https://unsplash.com/de/fotos/grune-blattpflanze-in-nahaufnahme-25xggax4bSA" class="credit-link">Unsplash</a></p>
            </div>
        </div>

        <!-- Sign Up Area 2/3 of width -->
         <div class="contentArea">
            <!-- Text Block -->
            <div class="textArea">
                <p>
                    This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.
                    Sign up <i>now</i> to get started.

                    You <i>know</i> you want to.
                </p>
            </div>
            <!-- Sign up form -->
             <div>
                <p>Let's do this.</p>
                <div>
                    <div>
                        <label>First Name</label>
                        <input id="first_name" type="text"/>
                    </div>
                    <div>
                        <label>Last Name</label>
                        <input id="last_name" type="text"/>
                    </div>
                    <div>
                        <label>email</label>
                        <input id="email" type="text"/>
                    </div>
                    <div>
                        <label>Phone Number</label>
                        <input id="phone_number" type="text"/>
                    </div>
                    <div>
                        <label>Password</label>
                        <input id="password" type="password"/>
                    </div>
                    <div>
                        <label>Confirm Password</label>
                        <input id="confirm_password" type="password"/>
                    </div>
                </div>
             </div>
             <!-- Create Account Button and rest-->
              <div>
                <button>Create Account</button>
                <p>Already have an Account? <a href="https://www.theodinproject.com">Log in</a></p>
              </div>
         </div>
    </div>
</body>
</html>
